<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CHAKAV Diseño — V2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f2eee6;color:#241d18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#211b17;color:#fff;padding:12px 16px}
header b{font-size:18px}.sub{font-size:12px;opacity:.72;margin-top:3px}
#viewer{height:62vh;min-height:430px;position:relative;background:linear-gradient(#eee9df,#d8cebd);overflow:hidden;touch-action:none}
#viewer canvas{display:block;width:100%;height:100%}
.tip{position:absolute;z-index:2;left:10px;top:10px;background:rgba(255,255,255,.9);padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.3;pointer-events:none}
.controls{background:#fff;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{min-height:48px;border:0;border-radius:12px;padding:10px;font-size:15px;font-weight:700;background:#2b2825;color:#fff}
button.wood{background:#966139}
.status{grid-column:1/-1;text-align:center;font-size:13px;color:#655b53;padding:3px 0}
.legend{grid-column:1/-1;font-size:12px;color:#776c63;text-align:center}
#error{display:none;position:absolute;inset:15px;z-index:5;background:#fff;padding:18px;border-radius:12px;color:#7a2b22}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
</script>
</head>
<body>
<header>
  <b>CHAKAV Diseño — V2</b>
  <div class="sub">Buró sólido 3D · 60 × 40 × 40 cm · espesor 1"</div>
</header>

<div id="viewer">
  <div class="tip">1 dedo: girar<br>2 dedos: zoom + desplazar</div>
  <div id="error">No se pudo cargar el motor 3D. Recarga la página con conexión a internet.</div>
</div>

<div class="controls">
  <button class="wood" id="b1">Abrir cajón 1</button>
  <button class="wood" id="b2">Abrir cajón 2</button>
  <button id="reset">Vista inicial</button>
  <button id="close">Cerrar ambos</button>
  <div class="status">60 × 40 × 40 cm · tablero 2.54 cm</div>
  <div class="legend">Modelo con piezas de volumen real, interiores de cajón y navegación táctil.</div>
</div>

<script type="module">
try {
  const THREE = await import('three');
  const { OrbitControls } = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js');

  const viewer = document.getElementById('viewer');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8e1d4);

  const camera = new THREE.PerspectiveCamera(38, viewer.clientWidth/viewer.clientHeight, 0.1, 1000);
  camera.position.set(78, 62, 92);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  viewer.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 29, 0);
  controls.minDistance = 65;
  controls.maxDistance = 220;
  controls.enablePan = true;
  controls.screenSpacePanning = true;
  controls.touches.ONE = THREE.TOUCH.ROTATE;
  controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;

  scene.add(new THREE.HemisphereLight(0xfff7e8, 0x75695f, 2.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(55, 95, 70);
  key.castShadow = true;
  scene.add(key);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(240,240),
    new THREE.MeshStandardMaterial({color:0xd6ccbd,roughness:1})
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -1.3;
  floor.receiveShadow = true;
  scene.add(floor);

  const wood = new THREE.MeshStandardMaterial({color:0x8b5834,roughness:.62,metalness:0});
  const woodFront = new THREE.MeshStandardMaterial({color:0xa36a3d,roughness:.58,metalness:0});
  const drawerWood = new THREE.MeshStandardMaterial({color:0x9a633a,roughness:.66,metalness:0});
  const dark = new THREE.MeshStandardMaterial({color:0x292623,roughness:.42,metalness:.15});

  const W=40, H=60, D=40, T=2.54;
  const cabinet = new THREE.Group();
  scene.add(cabinet);

  function box(name,w,h,d,x,y,z,mat=wood,parent=cabinet){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.name=name; m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
  }

  // Carcasa sólida. Frente = +Z.
  box('Costado izquierdo',T,H,D,-W/2+T/2,H/2,0);
  box('Costado derecho',T,H,D,W/2-T/2,H/2,0);
  box('Tapa',W-2*T,T,D,0,H-T/2,0);
  box('Base',W-2*T,T,D,0,T/2,0);
  box('Trasera',W-2*T,H-2*T,T,0,H/2,-D/2+T/2,new THREE.MeshStandardMaterial({color:0x70462d,roughness:.75}));

  // Cajones completos.
  const innerW = W - 2*T - 1.2;
  const drawerH = 24.3;
  const drawerD = 33;
  const sideT = 1.5;
  const bottomT = 1.2;
  const frontT = 2.0;

  function makeDrawer(y){
    const g = new THREE.Group();
    g.userData.closedZ = D/2 - frontT/2 + .25;
    g.position.set(0,y,g.userData.closedZ);
    cabinet.add(g);

    // Frente
    box('Frente',innerW,drawerH,frontT,0,0,0,woodFront,g);
    // Caja detrás del frente (Z negativo respecto al frente)
    const sideH = drawerH-3.5;
    const sideZ = -(drawerD/2);
    box('Lateral izq.',sideT,sideH,drawerD,-innerW/2+sideT/2,-1.0,sideZ,drawerWood,g);
    box('Lateral der.',sideT,sideH,drawerD,innerW/2-sideT/2,-1.0,sideZ,drawerWood,g);
    box('Trasera',innerW-2*sideT,sideH,sideT,0,-1.0,-drawerD+sideT/2,drawerWood,g);
    box('Fondo',innerW-2*sideT,bottomT,drawerD-sideT,0,-drawerH/2+2.2,-drawerD/2,drawerWood,g);
    // Jaladera
    box('Jaladera',9,1.5,1.8,0,0,frontT/2+1.0,dark,g);
    return g;
  }

  const d1=makeDrawer(44.0);
  const d2=makeDrawer(17.5);

  // Pequeña separación visual entre cajones.
  const rail = box('Travesaño',W-2*T,T,3,0,31.0,D/2-1.6,wood);

  let open1=false, open2=false;
  const travel=29;
  const b1=document.getElementById('b1'), b2=document.getElementById('b2');

  function setDrawer(group,open,button,n){
    group.userData.open=open;
    group.userData.targetZ=group.userData.closedZ+(open?travel:0);
    button.textContent=(open?'Cerrar':'Abrir')+' cajón '+n;
  }
  setDrawer(d1,false,b1,1); setDrawer(d2,false,b2,2);

  b1.addEventListener('click',()=>{open1=!open1;setDrawer(d1,open1,b1,1)});
  b2.addEventListener('click',()=>{open2=!open2;setDrawer(d2,open2,b2,2)});
  document.getElementById('close').addEventListener('click',()=>{
    open1=open2=false; setDrawer(d1,false,b1,1); setDrawer(d2,false,b2,2);
  });

  const startPos = new THREE.Vector3(78,62,92);
  document.getElementById('reset').addEventListener('click',()=>{
    camera.position.copy(startPos);
    controls.target.set(0,29,0);
    controls.update();
  });

  function resize(){
    const w=viewer.clientWidth,h=viewer.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false);
  }
  window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const k=1-Math.pow(.001,clock.getDelta());
    for(const g of [d1,d2]){
      const target=g.userData.targetZ ?? g.userData.closedZ;
      g.position.z += (target-g.position.z)*Math.min(k,0.22);
    }
    controls.update();
    renderer.render(scene,camera);
  }
  animate();
} catch(e) {
  document.getElementById('error').style.display='block';
  console.error(e);
}
</script>
</body>
</html>
